dlio:

  version: 1.1.1
  verbose: false
  save_replayed_bag: true
  # If keyframing is enabled, frames will be skipped.
  enable_keyframing: false
  enabling_publishing: false

  adaptive: true
  pointcloud:
    deskew: true
    voxelize: false

  imu:
    # The rate is only read if no input rosbag is provided.
    rate: 500
    # If an input bag is provided, calibration is done from the bag.
    calibration: true
    intrinsics:
      accel:
        bias: [ 0.0, 0.0, 0.0 ]
        sm:   [ 1.,  0.,  0.,
                0.,  1.,  0.,
                0.,  0.,  1. ]
      gyro:
        bias: [ 0.0, 0.0, 0.0 ]

  # These are only read if no input rosbag is provided.
  extrinsics:
    baselink2imu:
      t: [0.02200, 0.01300, -0.16900]
      R: [-0.00020, 1.00000, 0.00000,
          -1.00000, -0.00020, -0.00000,
          -0.00000, -0.00000, 1.00000]
    baselink2lidar:
      t: [ 0.,  0.,  0. ]
      R: [ 1.,  0.,  0.,
          0.,  1.,  0.,
          0.,  0.,  1. ]